worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/active/active.conf;

    server {
        listen 80;

        # Loopback only: the upgrade script asks which colour this worker generation serves.
        location = /_colour {
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 "$gateway_colour\n";
        }

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE streams must reach the client chunk by chunk, and a body must reach the gateway unbuffered.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;

            # A race can run for minutes; nginx's 60 s default would cut a quiet stream.
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;

            # A chat request is never replayed against another upstream.
            proxy_next_upstream off;

            # The gateway enforces its own body limit (GATEWAY_MAX_BUFFERED_REQUEST_BYTES).
            client_max_body_size 0;
        }
    }
}
