services:
  devshard-gateway:
    container_name: ${GATEWAY_INSTANCE_NAME:-devshard-gateway}
    image: ${GATEWAY_IMAGE:-kovec/gateway:v4-latest}
    env_file:
      - ${GATEWAY_ENV_FILE:-./config.devshard-gateway.env}
    volumes:
      - ${GATEWAY_STORAGE_HOST_DIR:-.devshard-gateway}:${GATEWAY_STORAGE_DIR:-/root/.devshard-gateway}
    environment:
      GOMEMLIMIT: ${GATEWAY_GOMEMLIMIT:-3400MiB}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"
    networks:
      join_default:
        aliases:
          - ${GATEWAY_INSTANCE_NAME:-devshard-gateway}
          - devshard-pool
    restart: unless-stopped
    healthcheck:
      # /metrics, not /v1/status: the kill switch turns /v1/status off, and a health check
      # pointed at it would have the orchestrator restart a gateway that was disabled on purpose.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  join_default:
    external: true
