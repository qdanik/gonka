services:
  # Extend the existing services with Jaeger environment variables
  proxy:
    environment:
      # Optional Jaeger UI proxying
      - JAEGER_ENABLED=${JAEGER_ENABLED:-false}
      - JAEGER_PORT=${JAEGER_PORT:-16686}
      - JAEGER_BASE_PATH=${JAEGER_BASE_PATH:-/jaeger}

  jaeger:
    container_name: jaeger
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    user: "0:0"
    command:
      - --config
      - /jaeger/config.yaml
    expose:
      - "16686"
      - "4317"
      - "4318"
    volumes:
      - ./jaeger.config.yaml:/jaeger/config.yaml:ro
      - jaeger_data:/var/lib/jaeger
    restart: unless-stopped

volumes:
  jaeger_data:
