services:
  mlnode-308:
    image: kovec/edonlm:0.2.8
    hostname: mlnode-308
    volumes:
      - ${HF_HOME:-${HOME}/.cache}:/root/.cache
    environment:
      - PIP_NO_CACHE_DIR=1
      - VLLM_FLASH_ATTN_VERSION=3
      - PYTORCH_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - HF_HOME=/root/.cache
      - OMP_NUM_THREADS=16
      - DISPLAY_SINGLE_GPU=false
      - DISPLAY_GPU_MEMORY_GB=179
      - GPU_DEVICE_NAME_OVERRIDE=NVIDIA B200
      - NCCL_P2P_LEVEL=NVL
      - NCCL_IB_DISABLE=0
      - NCCL_NET_GDR_LEVEL=5
      - NCCL_ALGO=Ring
      - NCCL_NSOCKS_PERTHREAD=4
      - NCCL_SOCKET_NTHREADS=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    command: uvicorn api.app:app --host=0.0.0.0 --port=8080
    restart: always

  inference:
    image: nginx:1.28.0
    hostname: inference
    ports:
      - "${PORT:-8080}:8080"
      - "127.0.0.1:${INFERENCE_PORT:-5050}:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
