global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: decentralized-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9000

  - job_name: devshardd
    http_sd_configs:
      - url: http://versiond:8080/prometheus/sd
        refresh_interval: 15s

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:9464
